[package]
name = "http-downloader"
version = "0.4.0"
authors = ["ycysdf"]
edition = "2024"
description = "支持多线程与断点续传的 Http 下载库"
readme = "README.md"
homepage = "https://github.com/ycysdf/http-downloader"
repository = "https://github.com/ycysdf/http-downloader"
license = "MIT"
keywords = ["download", "http", "network"]
categories = ["web-programming::http-client"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["examples/*"]

[dependencies]
anyhow = "1"
async-graphql = { version = "5", optional = true }
async-stream = { version = "0.3", optional = true }
async-trait = "0.1"
# optional dependencies
bson = { version = "2.3.0", optional = true }
bytes = "1.5"
content_disposition = "0.4.0"
futures-util = { version = "0.3" }
headers = "0.3"
parking_lot = { version = "0.12" }
reqwest = { version = "0.11", features = ["default-tls", "stream"] }
serde = { version = "1.0", optional = true }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-util = { version = "0.7", features = [] }
tracing = { version = "0.1", optional = true }
url = { version = "2" }

[dev-dependencies]
bson = { version = "2.3.0" }
serde = { version = "1.0" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

[features]
# 全部扩展
all-extensions = [
  "breakpoint-resume",
  "bson-file-archiver",
  "speed-limiter",
  "speed-tracker",
  "status-tracker",
  "tracing",
]
# 一些类型作为 async-graphql 输入或者输出对象
async-graphql = ["dep:async-graphql"]
# 断点续传
breakpoint-resume = ["tracing"]
# 断点续传，文件存储器
bson-file-archiver = [
  "breakpoint-resume",
  "bson",
  "serde",
  "tracing",
  "url/serde",
]
# 默认开启 tokio tracing
default = ["tracing"]
# 下载速度限制
speed-limiter = ["tracing"]
# 下载速度追踪
speed-tracker = ["tracing"]
# 下载状态追踪
status-tracker = ["tracing"]

